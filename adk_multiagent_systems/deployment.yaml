# Defines the Kubernetes resources required to deploy the investment analyst
# agent to GKE. Includes the Deployment (to run the container pods) and the
# Service (to expose the application via a Load Balancer).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investment-analyst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: investment-analyst
  template:
    metadata:
      labels:
        app: investment-analyst
    spec:
      serviceAccountName: investment-analyst-sa
      containers:
      - name: investment-analyst
        imagePullPolicy: Always
        image: ${GOOGLE_CLOUD_LOCATION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/adk-repo/investment-analyst:latest
        resources:
          limits:
            memory: "1Gi"
            cpu: "1000m"
            ephemeral-storage: "512Mi"
          requests:
            memory: "1Gi"
            cpu: "1000m"
            ephemeral-storage: "512Mi"
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: GOOGLE_CLOUD_PROJECT
          value: "${GOOGLE_CLOUD_PROJECT}"
        - name: GOOGLE_CLOUD_LOCATION
          value: "${GOOGLE_CLOUD_LOCATION}"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "true"
        - name: MODEL
          value: "gemini-2.5-flash"
---
apiVersion: v1
kind: Service
metadata:
  name: investment-analyst
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: investment-analyst
